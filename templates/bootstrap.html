{% extends "base.html" %}

{% block content %}

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">My Flask App</a>
    </div>
</nav>

<div class="container">
    <div class="p-5 mb-4 bg-light rounded-3">
        <h1 class="display-5 fw-bold">My Flask Website</h1>

        <p class="lead">
            This page uses a Bootstrap starter layout.
        </p>

        <a href="/image" class="btn btn-primary">
            View My Image
        </a>
    </div>

    <div class="row">
        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Task 1</h5>
                    <p class="card-text">Display a static image.</p>
                    <a href="/image" class="btn btn-secondary">
                        View Image
                    </a>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Task 3</h5>
                    <p class="card-text">Display dictionary information.</p>
                    <a href="/details" class="btn btn-secondary">
                        View Details
                    </a>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Task 4</h5>
                    <p class="card-text">Generate a random negative image.</p>
                    <a href="/random" class="btn btn-secondary">
                        Try It
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
